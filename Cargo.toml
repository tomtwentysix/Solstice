[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.5"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["SolarFlare Developments"]

[workspace.dependencies]
solstice-model = { path = "crates/model" }
solstice-engine = { path = "crates/engine" }
solstice-backend-jack = { path = "crates/backend-jack" }
solstice-vst3 = { path = "crates/vst3" }
solstice-interchange = { path = "crates/interchange" }
solstice-dsp = { path = "crates/dsp" }
solstice-clap = { path = "crates/clap" }
solstice-lv2 = { path = "crates/lv2" }
solstice-nam = { path = "crates/nam" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rtrb = "0.4"
hound = "3.5"
memmap2 = "0.9"
libc = "0.2"

[profile.release]
lto = "thin"
debug = 1

[profile.dev.package."*"]
opt-level = 2
